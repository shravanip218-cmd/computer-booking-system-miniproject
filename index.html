<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Leave Management System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#e8f1f8;
}

.container{
    width:700px;
    margin:40px auto;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#003366;
    margin-bottom:20px;
}

input,select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #bbb;
    border-radius:5px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.success{
    color:green;
    text-align:center;
    font-weight:bold;
    margin-top:15px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:25px;
}

table th{
    background:#007bff;
    color:white;
    padding:10px;
}

table td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

tr:nth-child(even){
    background:#f5f5f5;
}

</style>

</head>

<body>

<div class="container">

<h1>Employee Leave Management System</h1>

<form method="POST" onsubmit="return validateForm();">

<input
type="text"
id="employee"
name="employee"
placeholder="Enter Employee Name"
required>

<input
type="text"
name="empid"
placeholder="Enter Employee ID"
required>

<select name="leave_type" required>

<option value="">Select Leave Type</option>

<option>Sick Leave</option>

<option>Casual Leave</option>

<option>Annual Leave</option>

<option>Emergency Leave</option>

<option>Maternity Leave</option>

</select>

<input
type="number"
id="days"
name="days"
placeholder="Enter Number of Leave Days"
required>

<button type="submit">Apply Leave</button>

</form>

{% if message %}
<p class="success">{{ message }}</p>
{% endif %}

<h2 style="text-align:center;margin-top:25px;">
Leave Requests
</h2>

<table>

<tr>
<th>Employee Name</th>
<th>Employee ID</th>
<th>Leave Type</th>
<th>Days</th>
</tr>

{% for leave in leaves %}

<tr>

<td>{{ leave.employee }}</td>

<td>{{ leave.empid }}</td>

<td>{{ leave.leave_type }}</td>

<td>{{ leave.days }}</td>

</tr>

{% endfor %}

</table>

</div>

<script>

function validateForm(){

let employee=document.getElementById("employee").value.trim();

let days=document.getElementById("days").value;

if(employee.length<3){

alert("Employee name should contain at least 3 characters.");

return false;

}

if(days<=0){

alert("Leave days should be greater than zero.");

return false;

}

alert("Leave Request Submitted Successfully!");

return true;

}

</script>

</body>
</html>
